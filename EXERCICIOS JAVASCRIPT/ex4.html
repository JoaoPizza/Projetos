<html>
    <link rel="stylesheet" href="ex2.css">
    <head>

    </head>
    <body>
        <h1>Verificar se número é par ou impar</h1>
        <button onclick="clic()">Clique aqui para escrever seu número.</button>
    </body>
    <script>
        function clic(){
            let num = prompt("Digite seu número:")
            if (num%2==0){
                alert("Par!")
            }
            else{
                alert("Ímpar!")
            }
        }
    </script>
</html>
